<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>缴费中心</title><link rel="stylesheet" href="/portal.css"><style>.pay-card{background:#fff;border:1px solid #dce5eb;border-radius:12px;padding:24px;max-width:760px}.pay-card input{display:block;width:100%;box-sizing:border-box;padding:11px;margin:6px 0 14px;border:1px solid #bdcbd5;border-radius:7px}.pay-card button{background:#087f89;color:#fff;border:0;border-radius:7px;padding:11px 20px;cursor:pointer}.qr{max-width:220px;width:100%;display:block;margin:14px auto}.muted{color:#71818c}.status{white-space:pre-wrap;color:#a22}.order{padding:12px 0;border-bottom:1px solid #e5ebef}</style></head><body><main><section class="pay-card"><h2>缴费中心</h2><h3>报名费：10 元</h3><p>请扫码支付后，填写微信支付订单号、付款人昵称和付款时间。提交后等待管理员人工审核。提交即代表我本人已经充分明白若我因本人自身原因无法参赛或被取消资格报名费无法退回</p><img class="qr" src="/wechat-pay-qr.png" alt="微信收款码"><p class="muted">付款时间请按北京时间（UTC+8）填写。</p><label>付款订单号 / 备注<input id="orderref" placeholder="微信账单中的交易单号"></label><label>付款人微信昵称<input id="payer" placeholder="付款人昵称"></label><label>付款时间（北京时间）<input id="paidat" placeholder="例如 2027-07-01 18:30"></label><button onclick="submitPayment()">提交缴费审核</button><p id="msg" class="status"></p><h3>我的缴费记录</h3><div id="orders">加载中…</div><p><a href="/account.html">返回个人信息</a></p></section></main><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}async function submitPayment(){try{const d=await api('/api/payment',{method:'POST',body:JSON.stringify({payer_order_ref:$('#orderref').value,payer_name:$('#payer').value,paid_at_text:$('#paidat').value})});$('#msg').textContent='订单已提交，等待管理员核对。订单号：'+d.payment_id;$('#orderref').value='';await loadOrders()}catch(e){$('#msg').textContent=e.message}}async function loadOrders(){try{const d=await api('/api/payment');$('#orders').innerHTML=d.orders.length?d.orders.map(o=>`<div class="order">#${o.id}　¥${(o.amount_cents/100).toFixed(2)}　<b>${esc(({pending:'待审核',paid:'已确认缴费',rejected:'审核未通过'})[o.status]||o.status)}</b><br>订单：${esc(o.payer_order_ref)}　${esc(o.admin_note||'')}</div>`).join(''):'暂无缴费订单'}catch(e){$('#orders').textContent=e.message}}loadOrders();</script><script src="/portal.js"></script></body></html>
