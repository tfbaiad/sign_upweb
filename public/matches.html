<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高校联赛比赛列表</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#edf2f8;color:#203247;margin:0}.wrap{max-width:900px;margin:28px auto;padding:0 14px}.card{background:white;padding:20px;border:1px solid #d5e0eb;border-radius:12px;margin-bottom:16px}.match{padding:14px 0;border-bottom:1px solid #e3eaf1}.muted{color:#64788b}</style></head><body><main class="wrap"><section class="card"><h1>比赛列表</h1><p class="muted">登录后只显示与你所在队伍相关的比赛。房间号请勿转发给无关人员。</p><a href="/account.html">账户与缴费</a>　<a href="/teams.html">队伍列表</a><div id="list">加载中…</div><div id="msg"></div></section></main><script>const $=s=>document.querySelector(s);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{let r=await fetch('/api/matches/my'),d=await r.json();if(!r.ok)throw Error(d.error||'请先登录');$('#list').innerHTML=d.matches.length?d.matches.map(m=>`<article class="match"><h3>${esc(m.title)}</h3><p>${esc(m.teams||'')}</p><p>时间：${esc(m.starts_at||'待定')}</p><p>状态：${esc(m.status)}</p><p><b>比赛房间号：${esc(m.room_code||'待管理员发布')}</b></p><p>${esc(m.notes||'')}</p></article>`).join(''):'目前没有分配给你的比赛'}catch(e){$('#list').textContent=e.message+'。请先前往账户页面登录。'}}load();</script></body></html>
