<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>选手报名</title>
<style>
:root{--navy:#102b4e;--blue:#1769aa;--light:#eef4fa;--ink:#203247;--line:#d5e0eb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf1f8,#f8fafc);font-family:"Microsoft YaHei",Arial,sans-serif;color:var(--ink)}header{background:var(--navy);color:white;padding:24px 18px;text-align:center;border-bottom:5px solid #3d8bd0;position:relative}header h1{margin:0;font-size:clamp(22px,4vw,32px);letter-spacing:2px}header p{margin:8px 0 0;color:#d6e6f5}.wrap{max-width:760px;margin:34px auto;padding:0 16px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 35px #102b4e12;overflow:hidden}.panel h2{font-size:19px;margin:0;padding:17px 22px;background:#f4f8fc;border-bottom:1px solid var(--line)}form{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-weight:600;font-size:14px}input,select{width:100%;border:1px solid #bdccda;border-radius:6px;padding:11px 12px;font:inherit;background:#fff}input:focus,select:focus{outline:2px solid #b8daf7;border-color:var(--blue)}button{grid-column:1/-1;background:var(--blue);border:0;border-radius:6px;color:white;padding:13px;font-size:16px;font-weight:700;cursor:pointer}button:hover{background:#10588f}button:disabled{opacity:.6;cursor:wait}.notice{padding:0 22px 22px;font-size:13px;color:#60758a;line-height:1.7}.status{padding:0 22px 18px;font-size:14px}.status:empty{display:none}footer{text-align:center;padding:22px;color:#718195;font-size:12px}@media(max-width:560px){form{grid-template-columns:1fr}.field.full,button{grid-column:auto}}
</style><link rel="stylesheet" href="/portal.css"></head>
<body><header><h1>高校联赛选手报名</h1><p>请准确填写选手信息，提交后请留意赛事组通知</p></header>
<main class="wrap"><section class="panel"><h2>选手报名信息</h2>
<form id="signup">
<div class="field full"><label for="player_name">选手完美名称 *</label><input id="player_name" name="player_name" required maxlength="100" placeholder="请输入游戏内名称"></div>
<div class="field full"><label for="steam_id">选手 Steam64 位 ID *</label><input id="steam_id" name="steam_id" required inputmode="numeric" maxlength="30" placeholder="请输入 SteamID64"></div>
<div class="field"><label for="qq">QQ *</label><input id="qq" name="qq" required inputmode="numeric" maxlength="20" placeholder="QQ 号码"></div>
<div class="field"><label for="backup_phone">备用手机号</label><input id="backup_phone" name="backup_phone" inputmode="tel" maxlength="30" placeholder="用于必要时联系"></div>
<div class="field"><label for="rank">选手完美段位 *</label><select id="rank" name="rank" required><option value="">请选择段位</option><option>D</option><option>C</option><option>C+</option><option>C++</option><option>B</option><option>B+</option><option>B++</option><option>A</option><option>A+</option><option>A++</option><option>S0-9</option><option>S10-24</option><option>S25-49</option><option>S>=50</option></select></div>
<div class="field"><label for="school">选手学校 *</label><select id="school" name="school" required><option value="">请选择学校</option><option>梁丰高级中学及其国际部</option><option>沙州中学本校区</option><option>沙州中学北校区</option><option>暨阳高级中学</option><option>张家港高级中学</option><option>塘桥高级中学</option><option>崇真中学</option><option>凤凰高级中学</option><option>乐余高级中学</option><option>常青藤实验学校及其国际部</option><option>外国语实验学校及其国际部</option><option>张家港第一职业学校</option><option>张家港第二职业学校</option><option>张家港第三职业学校</option><option>张家港开放大学</option><option>江苏科技大学张家港校区</option><option>江科大苏州理工学院</option><option>沙洲工学院</option><option>张家港市艺术学校（原张家港舞蹈学校）</option><option>张家港市特殊教育学校</option></select></div>
<button id="submit" type="submit">提交报名</button>
</form><div class="status" id="status" role="status" aria-live="polite"></div><div class="notice">带 * 为必填项。请确认 Steam64 位 ID 和联系方式填写正确。请勿重复提交；如需修改信息，请联系赛事管理员。</div></section></main>
<footer>高校联赛报名系统</footer>
<script>
const form=document.querySelector('#signup'),statusBox=document.querySelector('#status'),submitBtn=document.querySelector('#submit');
form.addEventListener('submit',async e=>{e.preventDefault();statusBox.textContent='';submitBtn.disabled=true;submitBtn.textContent='正在提交…';const payload=Object.fromEntries(new FormData(form).entries());try{const r=await fetch('/api/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'提交失败，请稍后重试');statusBox.textContent='报名提交成功！请勿重复提交。';statusBox.style.color='#167344';form.reset()}catch(err){statusBox.textContent=err.message||'网络异常，请稍后重试';statusBox.style.color='#b42318'}finally{submitBtn.disabled=false;submitBtn.textContent='提交报名'}});
</script><script src="/portal.js"></script></body></html>
