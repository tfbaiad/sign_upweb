<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人信息</title><link rel="stylesheet" href="/portal.css"><style>.profile-card{background:#fff;border:1px solid #dce5eb;border-radius:12px;padding:24px;max-width:760px}.profile-card h2{margin-top:0;color:#123b56}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.profile-item{padding:14px;background:#f5f8fa;border-radius:8px}.profile-item small{display:block;color:#71818c;margin-bottom:6px}.profile-item b{overflow-wrap:anywhere}.muted{color:#71818c}@media(max-width:600px){.profile-grid{grid-template-columns:1fr}}</style></head><body><main><section class="profile-card"><h2>个人信息</h2><p class="muted">这里仅展示你的账户及报名个人资料，缴费请前往独立的缴费中心。</p><div id="profile">正在加载…</div><p><a href="/signup.html">查看 / 完善报名资料</a>　<a href="/payment.html">前往缴费中心 →</a></p></section></main><script>const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const el=document.querySelector('#profile');try{const r=await fetch('/api/auth/me',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'请先登录');const a=d.account;el.innerHTML=`<div class="profile-grid"><div class="profile-item"><small>账户用户名</small><b>${esc(a.username)}</b></div><div class="profile-item"><small>Steam64</small><b>${esc(a.steam_id)}</b></div><div class="profile-item"><small>游戏名称</small><b>${esc(a.player_name)}</b></div><div class="profile-item"><small>学校</small><b>${esc(a.school)}</b></div><div class="profile-item"><small>QQ</small><b>${esc(a.qq)}</b></div><div class="profile-item"><small>完美段位</small><b>${esc(a.rank)}</b></div><div class="profile-item"><small>报名资料</small><b>${a.player_id?'已提交':'尚未提交'}</b></div><div class="profile-item"><small>参赛身份</small><b>${a.account_role==='captain'?'队长':'队员'}</b></div></div>`}catch(e){el.textContent=e.message}})();</script><script src="/portal.js"></script></body></html>
