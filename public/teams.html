<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高校联赛队伍列表</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#edf2f8;color:#203247;margin:0}.wrap{max-width:1000px;margin:28px auto;padding:0 14px}.card{background:white;padding:20px;border:1px solid #d5e0eb;border-radius:12px;margin-bottom:16px}input,select,button{font:inherit;padding:10px;border:1px solid #bdccda;border-radius:6px;margin:4px}button{background:#1769aa;color:white;border:0;cursor:pointer}.team{border-bottom:1px solid #e3eaf1;padding:12px 0}.msg{color:#a22;white-space:pre-wrap}</style></head><body><main class="wrap"><section class="card"><h1>高校联赛 · 队伍列表</h1><p>创建队伍需要已登录且选择队长身份，队长本人须已报名并完成缴费审核。每队 6–7 人，5 名正式队员（含队长），最多 2 名替补。</p><a href="/account.html">账户与缴费</a>　<a href="/matches.html">比赛列表</a><div id="create" style="display:none"><h3>创建队伍</h3><input id="teamname" placeholder="队伍名称"><button onclick="createTeam()">创建队伍</button></div><div id="mine"></div><div id="msg" class="msg"></div></section><section class="card"><h2>所有队伍</h2><div id="teams">加载中…</div></section></main><script>const $=s=>document.querySelector(s);async function api(url,opts={}){let r=await fetch(url,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{let a=await api('/api/auth/me');if(a.account.account_role==='captain'&&!a.account.player_id===false)$('#create').style.display='block';let m=await api('/api/teams/members');if(m.team){$('#mine').innerHTML=`<h3>我的队伍：${esc(m.team.name)}（${m.members.length}/7）</h3><p>状态：${esc(m.team.status)}</p>`+m.members.map(x=>`<p>${esc(x.player_name||x.username)} · ${x.roster_role==='starter'?'正式队员':'替补'} · ${esc(x.school||'')}</p>`).join('');if(m.team.captain_account_id===a.account.id&&m.eligible.length){$('#mine').innerHTML+=`<h3>添加已缴费选手</h3><select id="candidate">${m.eligible.map(x=>`<option value="${x.account_id}">${esc(x.player_name||x.username)} / ${esc(x.school||'')} / ${esc(x.steam_id)}</option>`).join('')}</select><select id="roster"><option value="starter">正式队员</option><option value="substitute">替补</option></select><button onclick="addMember(${m.team.id})">添加队员</button>`}}}catch(e){}try{let d=await api('/api/teams');$('#teams').innerHTML=d.teams.map(t=>`<div class="team"><b>${esc(t.name)}</b>　${esc(t.captain)}　${t.member_count}/7 人　${esc(t.status)}</div>`).join('')||'暂无队伍'}catch(e){$('#teams').textContent=e.message}}async function createTeam(){try{let d=await api('/api/teams',{method:'POST',body:JSON.stringify({name:$('#teamname').value})});$('#msg').textContent='创建成功';await load()}catch(e){$('#msg').textContent=e.message}}async function addMember(id){try{await api('/api/teams',{method:'PATCH',body:JSON.stringify({team_id:id,account_id:Number($('#candidate').value),roster_role:$('#roster').value})});$('#msg').textContent='队员已添加';await load()}catch(e){$('#msg').textContent=e.message}}load();</script></body></html>
