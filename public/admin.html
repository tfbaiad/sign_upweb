<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赛事管理后台</title><style>
:root{--navy:#102b4e;--blue:#1769aa;--bg:#eef4fa;--ink:#203247;--line:#d5e0eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Microsoft YaHei",Arial,sans-serif;color:var(--ink)}header{background:var(--navy);color:#fff;padding:20px max(18px,calc((100% - 1200px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:22px;margin:0}a{color:#fff}main{max-width:1200px;margin:24px auto;padding:0 14px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}.panel h2{margin:0;padding:15px 18px;background:#f4f8fc;border-bottom:1px solid var(--line);font-size:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#f4f8fc;border-bottom:1px solid var(--line)}.sectionhead h2{border:0}.sectionhead button{margin-right:14px}.pad{padding:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:12px}input,select{width:100%;padding:10px;border:1px solid #bdccda;border-radius:6px;font:inherit}button{border:0;background:var(--blue);color:white;padding:10px 14px;border-radius:6px;font-weight:700;cursor:pointer}button.secondary{background:#50657a}button:disabled{opacity:.6}.hidden{display:none!important}.msg{margin-top:12px;color:#a22}.tabs{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}.tabs button{background:#e4edf6;color:#173b5d}.tabs button.active{background:var(--blue);color:white}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{border-bottom:1px solid #e3eaf1;padding:9px;text-align:left;font-size:13px}th{background:#f7f9fc;position:sticky;top:0}td input,td select{min-width:95px;padding:7px;font-size:13px}.actions{display:flex;gap:7px;align-items:center}.hint{font-size:13px;color:#65798c;line-height:1.7}.record{padding:12px 18px;border-bottom:1px solid #e6edf4}.record:last-child{border-bottom:0}.recordgrid{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px}.recordgrid label{font-size:12px;color:#62768b}.recordgrid input{margin-top:5px}@media(max-width:700px){.grid{grid-template-columns:1fr}.recordgrid{grid-template-columns:1fr 1fr}header{align-items:flex-start}}
</style><link rel="stylesheet" href="/portal.css"></head><body><header><h1>CS2 高校联赛 · 管理后台</h1><div><a href="index.html">返回报名页</a>　<button id="logout" class="secondary hidden">退出登录</button></div></header><main>
<section class="panel" id="auth"><h2 id="authTitle">管理员登录</h2><div class="pad"><p class="hint" id="authHint">使用管理员账号和密码登录。</p><div class="grid"><input id="username" placeholder="管理员用户名" autocomplete="username"><input id="password" type="password" placeholder="管理员密码" autocomplete="current-password"></div><p><button id="authSubmit">登录</button></p><div class="msg" id="authMsg" role="status"></div></div></section>
<section id="dashboard" class="hidden"><div class="tabs" id="adminTabs"><button class="active" data-tab="basic">报名与承诺书</button><button data-tab="payments">缴费审核</button><button data-tab="matches">比赛管理</button><button data-tab="announcements">公告管理</button><button data-tab="admins">管理员管理</button></div><div id="tab-basic"><div class="panel"><h2>管理说明</h2><div class="pad hint">管理员可以查看报名和承诺书提交结果，并直接修改记录后保存。管理员账号使用密码哈希保存于 D1，登录会话通过 HttpOnly Cookie 维护。请勿把初始化密钥提交到 GitHub。</div></div><div class="panel"><div class="sectionhead"><h2>报名提交结果</h2><button id="exportPlayers" type="button">导出报名 Excel（CSV）</button></div><div id="players" class="tablewrap"><p class="pad">加载中…</p></div></div><div class="panel"><div class="sectionhead"><h2>承诺书提交结果</h2><button id="exportCommitments" type="button">导出承诺书 Excel（CSV）</button></div><div id="commitments"><p class="pad">加载中…</p></div></div></div><div id="tab-payments" class="hidden"><div class="panel"><div class="sectionhead"><h2>缴费订单人工审核</h2><button type="button" onclick="loadPayments()">刷新订单</button></div><div class="pad tablewrap" id="payments">加载中…</div></div></div><div id="tab-matches" class="hidden"><div class="panel"><h2>发布比赛与房间号</h2><div class="pad"><div class="grid"><input id="matchTitle" placeholder="比赛名称"><input id="matchStarts" placeholder="比赛时间"><input id="matchRoom" placeholder="房间号"></div><div class="grid"><select id="matchTeam1"></select><select id="matchTeam2"></select><input id="matchNotes" placeholder="备注"></div><button type="button" onclick="publishMatch()">发布比赛</button><button type="button" class="secondary" onclick="loadMatches()">刷新比赛</button><div id="matchMsg" class="msg"></div><div id="matches" class="pad"></div></div></div></div><div id="tab-announcements" class="hidden"><div class="panel"><h2>发布赛事公告</h2><div class="pad"><input id="announcementTitle" placeholder="公告标题"><textarea id="announcementBody" rows="5" style="width:100%;margin-top:10px" placeholder="公告内容"></textarea><p><label><input type="checkbox" id="announcementPinned" style="width:auto"> 置顶公告</label> <button type="button" onclick="publishAnnouncement()">发布公告</button></p><div id="announcementMsg" class="msg"></div><div id="announcements"></div></div></div></div><div id="tab-admins" class="hidden"><div class="panel"><h2>创建管理员账号</h2><div class="pad"><div class="grid"><input id="newUsername" placeholder="新管理员用户名"><input id="newPassword" type="password" placeholder="新密码（至少 12 位）"><div><button id="createUser">创建账号</button></div></div><div id="userMsg" class="msg"></div><div id="userList" class="hint"></div></div></div></div></section></main>
<script>
const $=s=>document.querySelector(s);let exportData={players:[],commitments:[]};const schools=['梁丰高级中学及其国际部', '沙州中学本校区', '沙州中学北校区', '暨阳高级中学', '张家港高级中学', '塘桥高级中学', '崇真中学', '凤凰高级中学', '乐余高级中学', '常青藤实验学校及其国际部', '外国语实验学校及其国际部', '张家港第一职业学校', '张家港第二职业学校', '张家港第三职业学校', '张家港开放大学', '江苏科技大学张家港校区', '江科大苏州理工学院', '沙洲工学院', '张家港市艺术学校（原张家港舞蹈学校）', '张家港市特殊教育学校'];const ranks=['D','C','C+','C++','B','B+','B++','A','A+','A++','S0-9','S10-24','S25-49','S>=50'];
$('#authSubmit').onclick=async()=>{const b={username:$('#username').value,password:$('#password').value};let url='/api/admin/login';$('#authSubmit').disabled=true;try{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');await showDashboard()}catch(e){$('#authMsg').textContent=e.message}finally{$('#authSubmit').disabled=false}};
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}
async function showDashboard(){const me=await api('/api/admin/me');$('#auth').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#logout').classList.remove('hidden');await loadData();await loadUsers()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function input(value,key,id){return `<input data-key="${key}" data-id="${id}" value="${esc(value)}">`}
function schoolSelect(value,key,id){const opts=[...new Set([...(schools||[]),String(value||'')].filter(Boolean))];return `<select data-key="${key}" data-id="${id}"><option value="">请选择学校</option>${opts.map(v=>`<option value="${esc(v)}" ${String(value)===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
async function loadData(){const d=await api('/api/admin/data');exportData=d;$('#players').innerHTML=d.players.length?`<table><thead><tr><th>ID</th><th>完美名称</th><th>Steam64</th><th>QQ</th><th>备用手机</th><th>段位</th><th>学校</th><th>提交时间</th><th>操作</th></tr></thead><tbody>${d.players.map(x=>`<tr data-type="player" data-id="${x.id}"><td>${x.id}</td><td>${input(x.player_name,'player_name',x.id)}</td><td>${input(x.steam_id,'steam_id',x.id)}</td><td>${input(x.qq,'qq',x.id)}</td><td>${input(x.backup_phone,'backup_phone',x.id)}</td><td><select data-key="rank" data-id="${x.id}">${ranks.map(v=>`<option ${x.rank===v?'selected':''}>${v}</option>`).join('')}</select></td><td>${schoolSelect(x.school,'school',x.id)}</td><td>${esc(x.created_at)}</td><td><button onclick="saveRow('player',${x.id})">保存修改</button></td></tr>`).join('')}</tbody></table>`:'<p class="pad">暂无报名记录。</p>';
$('#commitments').innerHTML=d.commitments.length?d.commitments.map(x=>`<div class="record" data-type="commitment" data-id="${x.id}"><strong>承诺书 #${x.id}</strong><div class="recordgrid">${[['school','学校'],['player_name','完美名称'],['team_name','参赛队伍'],['qq','QQ'],['signed_date','填写日期']].map(([k,l])=>`<label>${l}${k==='school'?schoolSelect(x[k],k,x.id):input(x[k],k,x.id)}</label>`).join('')}<label>提交时间<input value="${esc(x.created_at)}" disabled></label></div><p><button onclick="saveRow('commitment',${x.id})">保存修改</button></p></div>`).join(''):'<p class="pad">暂无承诺书记录。</p>'}
window.saveRow=async(type,id)=>{const parent=document.querySelector(`[data-type="${type}"][data-id="${id}"]`),body={type,id};parent.querySelectorAll('[data-key]').forEach(el=>body[el.dataset.key]=el.value);try{await api('/api/admin/data',{method:'PATCH',body:JSON.stringify(body)});alert('已保存修改')}catch(e){alert(e.message)}};

function exportCsv(filename,headers,rows){
 const cell=v=>{let x=String(v??'');if(/^[\s]*[=+@\-]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};
 const csv='\ufeff'+[headers,...rows].map(row=>row.map(cell).join(',')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
$('#exportPlayers').onclick=()=>exportCsv('CS2高校联赛_报名数据.csv',['ID','完美名称','Steam64','QQ','备用手机','段位','学校','提交时间'],exportData.players.map(x=>[x.id,x.player_name,x.steam_id,x.qq,x.backup_phone,x.rank,x.school,x.created_at]));
$('#exportCommitments').onclick=()=>exportCsv('CS2高校联赛_承诺书数据.csv',['ID','学校','完美名称','参赛队伍','QQ','填写日期','提交时间'],exportData.commitments.map(x=>[x.id,x.school,x.player_name,x.team_name,x.qq,x.signed_date,x.created_at]));
async function loadUsers(){const d=await api('/api/admin/users');$('#userList').textContent='现有管理员：'+d.users.map(x=>x.username+'（'+x.created_at+'）').join('、')}
$('#createUser').onclick=async()=>{try{await api('/api/admin/users',{method:'POST',body:JSON.stringify({username:$('#newUsername').value,password:$('#newPassword').value})});$('#userMsg').textContent='管理员账号创建成功';$('#newUsername').value='';$('#newPassword').value='';await loadUsers()}catch(e){$('#userMsg').textContent=e.message}}
$('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.reload()};api('/api/admin/me').then(showDashboard).catch(()=>{});
</script>
<script>
const adminApi=async(url,opts={})=>{const r=await fetch(url,{...opts,credentials:'same-origin',headers:{'content-type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d};
document.querySelectorAll('#adminTabs [data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#adminTabs [data-tab]').forEach(x=>x.classList.toggle('active',x===b));['basic','payments','matches','announcements','admins'].forEach(k=>document.getElementById('tab-'+k).classList.toggle('hidden',k!==b.dataset.tab));}));
window.loadPayments=async()=>{const el=document.querySelector('#payments');try{const d=await adminApi('/api/admin/payments');el.innerHTML=d.payments.length?`<table><thead><tr><th>ID</th><th>选手/学校</th><th>Steam64</th><th>金额</th><th>订单号</th><th>付款人/时间</th><th>状态</th><th>备注</th><th>操作</th></tr></thead><tbody>${d.payments.map(p=>`<tr><td>${p.id}</td><td>${safe(p.player_name||p.username)} / ${safe(p.school||'未关联报名')}</td><td>${safe(p.steam_id||'')}</td><td>¥${(p.amount_cents/100).toFixed(2)}</td><td>${safe(p.payer_order_ref)}</td><td>${safe(p.payer_name)} / ${safe(p.paid_at_text)}</td><td>${safe(({pending:'待审核',paid:'已确认',rejected:'未通过'})[p.status]||p.status)}</td><td><input id="paynote${p.id}" value="${safe(p.admin_note)}"></td><td><button onclick="reviewPayment(${p.id},'paid')">确认</button> <button class="secondary" onclick="reviewPayment(${p.id},'rejected')">驳回</button></td></tr>`).join('')}</tbody></table>`:'暂无缴费订单'}catch(e){el.textContent=e.message}};
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.reviewPayment=async(id,status)=>{try{await adminApi('/api/admin/payments',{method:'PATCH',body:JSON.stringify({payment_id:id,status,admin_note:document.querySelector('#paynote'+id).value})});await loadPayments()}catch(e){alert(e.message)}};
window.loadMatches=async()=>{try{const d=await adminApi('/api/admin/matches');const opts=d.teams.map(t=>`<option value="${t.id}">${safe(t.name)} (${safe(t.status)})</option>`).join('');document.querySelector('#matchTeam1').innerHTML=opts;document.querySelector('#matchTeam2').innerHTML=opts;document.querySelector('#matches').innerHTML=d.matches.map(m=>`<p>#${m.id} ${safe(m.title)} · ${safe(m.teams||'未分配')} · ${safe(m.starts_at)} · 房间号：${safe(m.room_code)}</p>`).join('')||'暂无比赛'}catch(e){document.querySelector('#matches').textContent=e.message}};
window.publishMatch=async()=>{try{const a=document.querySelector('#matchTeam1').value,b=document.querySelector('#matchTeam2').value;if(!a||!b||a===b)throw Error('请选择两支不同队伍');await adminApi('/api/admin/matches',{method:'POST',body:JSON.stringify({title:document.querySelector('#matchTitle').value,starts_at:document.querySelector('#matchStarts').value,room_code:document.querySelector('#matchRoom').value,notes:document.querySelector('#matchNotes').value,team_ids:[a,b]})});document.querySelector('#matchMsg').textContent='比赛已发布';await loadMatches()}catch(e){document.querySelector('#matchMsg').textContent=e.message}};
window.loadAnnouncements=async()=>{try{const d=await adminApi('/api/admin/announcements');document.querySelector('#announcements').innerHTML=d.announcements.map(a=>`<div class="record"><b>${a.is_pinned?'[置顶] ':''}${safe(a.title)}</b><p>${safe(a.body)}</p><small>${safe(a.created_at)}</small>　<button class="secondary" onclick="deleteAnnouncement(${a.id})">删除</button></div>`).join('')||'暂无公告'}catch(e){document.querySelector('#announcements').textContent=e.message}};
window.publishAnnouncement=async()=>{const title=document.querySelector('#announcementTitle').value.trim(),body=document.querySelector('#announcementBody').value.trim();try{await adminApi('/api/admin/announcements',{method:'POST',body:JSON.stringify({title,body,is_pinned:document.querySelector('#announcementPinned').checked})});document.querySelector('#announcementMsg').textContent='公告发布成功';document.querySelector('#announcementTitle').value='';document.querySelector('#announcementBody').value='';await loadAnnouncements()}catch(e){document.querySelector('#announcementMsg').textContent=e.message}};
window.deleteAnnouncement=async(id)=>{if(!confirm('确定删除这条公告？'))return;try{await adminApi('/api/admin/announcements',{method:'DELETE',body:JSON.stringify({id})});await loadAnnouncements()}catch(e){alert(e.message)}};
const originalShowDashboard=showDashboard;showDashboard=async()=>{await originalShowDashboard();await Promise.all([loadPayments(),loadMatches(),loadAnnouncements()])};
</script></body></html>
