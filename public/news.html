<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赛事公告</title><link rel="stylesheet" href="/portal.css"><style>.news-item{background:#fff;border:1px solid #dce5eb;border-radius:10px;padding:18px;margin:14px 0}.news-item h3{margin:0 0 10px}.news-meta{font-size:12px;color:#7b8995;margin-bottom:12px}.news-body{white-space:pre-wrap;line-height:1.8;color:#354657}.pin{color:#c28a2b;font-weight:700;margin-right:8px}</style></head><body><section class="portal-box"><h2>赛事公告</h2><div id="newsList">公告加载中…</div></section><script src="/portal.js"></script><script>
(async()=>{const el=document.querySelector('#newsList');try{const r=await fetch('/api/announcements',{cache:'no-store'});const d=await r.json();el.innerHTML=(d.announcements||[]).map(a=>`<article class="news-item"><h3>${esc(a.title)}</h3><div class="news-meta">${a.is_pinned?'<span class="pin">置顶</span>':''}${esc(a.created_at||'')}</div><div class="news-body">${esc(a.body)}</div></article>`).join('')||'暂无赛事公告。'}catch{el.textContent='公告加载失败，请稍后重试。'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})();
</script></body></html>
