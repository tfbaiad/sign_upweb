<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选手账户与缴费</title><style>body{margin:0;background:#edf2f8;color:#203247;font-family:Arial,'Microsoft YaHei',sans-serif}.wrap{max-width:850px;margin:28px auto;padding:0 14px}.card{background:white;border:1px solid #d5e0eb;border-radius:12px;padding:22px;margin-bottom:16px}h1{margin-top:0;color:#12305e}input,select,button{font:inherit;padding:11px;border-radius:7px;border:1px solid #bdccda}input{width:100%;box-sizing:border-box;margin:5px 0 12px}button{background:#1769aa;color:white;border:0;cursor:pointer;margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.muted{color:#64788b;font-size:14px}.status{white-space:pre-wrap;color:#a22;margin-top:12px}.hidden{display:none!important}.qr{max-width:220px;width:100%;display:block;margin:12px auto}a{color:#1769aa}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/portal.css"></head><body><main class="wrap"><section class="card"><h1>选手账户</h1><p class="muted">账号与 Steam64 绑定。请使用真实 Steam64；同一个 Steam64 不能重复注册。</p><div id="auth"><div class="grid"><div><h3>注册账户</h3><input id="ruser" placeholder="用户名（3-32位）"><input id="rpass" type="password" placeholder="密码（至少10位）"><input id="rsteam" placeholder="Steam64 ID"><button onclick="register()">注册并登录</button></div><div><h3>已有账户登录</h3><input id="luser" placeholder="用户名"><input id="lpass" type="password" placeholder="密码"><button onclick="login()">登录</button></div></div></div><div id="profile" class="hidden"></div><div id="msg" class="status"></div></section><section id="pay" class="card hidden"><h2>报名费：10 元</h2><p>请扫码支付后，填写微信支付订单号（或可供管理员核对的付款单号）、付款人昵称和付款时间。提交后等待管理员人工审核。</p><img class="qr" src="/wechat-pay-qr.png" alt="请上传微信收款码"><p class="muted">请将你的收款码图片命名为 <code>wechat-pay-qr.png</code> 并放入 public 目录。当前占位图尚未提供真实收款码。</p><label>付款订单号 / 备注<input id="orderref" placeholder="微信账单中的交易单号"></label><label>付款人微信昵称<input id="payer" placeholder="付款人昵称"></label><label>付款时间<input id="paidat" placeholder="例如 2027-07-01 18:30"></label><button onclick="submitPayment()">提交缴费审核</button><h3>我的缴费记录</h3><div id="orders"></div></section><section class="card"><a href="/">← 返回报名页面</a>　<a href="/teams.html">队伍列表</a>　<a href="/matches.html">比赛列表</a></section></main><script>const $=s=>document.querySelector(s);async function api(url,opts={}){let r=await fetch(url,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}function msg(t){$('#msg').textContent=t}async function register(){try{let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({username:$('#ruser').value,password:$('#rpass').value,steam_id:$('#rsteam').value})});msg(d.registration_found?'注册成功并已关联已有报名资料。':'注册成功。请继续填写报名表，Steam64 必须与账号一致。');await load()}catch(e){msg(e.message)}}async function login(){try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('#luser').value,password:$('#lpass').value})});msg('登录成功');await load()}catch(e){msg(e.message)}}async function load(){try{let d=await api('/api/auth/me'),a=d.account;$('#auth').classList.add('hidden');$('#profile').classList.remove('hidden');$('#pay').classList.remove('hidden');$('#profile').innerHTML=`<b>已登录：${esc(a.username)}</b><p>Steam64：${esc(a.steam_id)}</p><p>报名：${a.player_id?'已提交':'尚未提交'}；缴费状态：${esc(a.payment_status||'未提交订单')}</p><label>承诺书身份<select id="role"><option value="member" ${a.account_role==='member'?'selected':''}>队员</option><option value="captain" ${a.account_role==='captain'?'selected':''}>队长</option></select></label> <button onclick="saveRole()">保存身份</button> <button onclick="logout()">退出登录</button>`;await loadOrders()}catch(e){$('#auth').classList.remove('hidden');$('#profile').classList.add('hidden');$('#pay').classList.add('hidden')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function saveRole(){try{await api('/api/auth/role',{method:'PATCH',body:JSON.stringify({account_role:$('#role').value})});msg('身份已保存。承诺书页面仍需按部署说明接入同一身份字段。')}catch(e){msg(e.message)}}async function submitPayment(){try{let d=await api('/api/payment',{method:'POST',body:JSON.stringify({payer_order_ref:$('#orderref').value,payer_name:$('#payer').value,paid_at_text:$('#paidat').value})});msg('订单已提交，等待管理员核对。订单号：'+d.payment_id);$('#orderref').value='';await loadOrders()}catch(e){msg(e.message)}}async function loadOrders(){try{let d=await api('/api/payment');$('#orders').innerHTML=d.orders.length?d.orders.map(o=>`<p>#${o.id}　¥${(o.amount_cents/100).toFixed(2)}　<b>${esc(({pending:'待审核',paid:'已确认缴费',rejected:'审核未通过'})[o.status]||o.status)}</b>　${esc(o.payer_order_ref)}　${esc(o.admin_note)}</p>`).join(''):'暂无缴费订单'}catch(e){}}async function logout(){await api('/api/auth/logout',{method:'POST'});location.reload()}load();</script><script src="/portal.js"></script></body></html>
