<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赛事运营管理</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#edf2f8;color:#203247;margin:0}.wrap{max-width:1150px;margin:25px auto;padding:0 14px}.card{background:#fff;border:1px solid #d5e0eb;border-radius:10px;margin-bottom:16px;overflow:hidden}.card h2{margin:0;background:#f4f8fc;padding:15px;border-bottom:1px solid #d5e0eb}.pad{padding:16px}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #bdccda;border-radius:6px;margin:4px;box-sizing:border-box}button{background:#1769aa;color:white;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:8px}table{border-collapse:collapse;width:100%;min-width:850px}td,th{border-bottom:1px solid #e3eaf1;padding:9px;text-align:left;font-size:13px}.scroll{overflow:auto}.msg{white-space:pre-wrap;color:#a22}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/portal.css"></head><body><main class="wrap"><h1>CS2 高校联赛 · 运营管理</h1><p>本页复用现有管理员登录 Cookie。请先在原有 <a href="/admin.html">管理员后台</a> 登录，再打开本页面。</p><section class="card"><h2>缴费订单人工审核</h2><div class="pad"><button onclick="loadPayments()">刷新订单</button><div class="scroll" id="payments">加载中…</div></div></section><section class="card"><h2>发布比赛与房间号</h2><div class="pad"><div class="grid"><input id="title" placeholder="比赛名称，例如：瑞士轮第1轮"><input id="starts" placeholder="比赛时间，例如 2027-07-01 19:00"><input id="room" placeholder="房间号（仅相关队伍成员可见）"></div><p>选择两支已完成绑定的队伍：</p><div class="grid"><select id="team1"></select><select id="team2"></select><input id="notes" placeholder="备注、地图、注意事项"></div><button onclick="publish()">发布比赛</button><button onclick="loadMatches()">刷新比赛</button><div class="msg" id="msg"></div><div class="scroll" id="matches"></div></div></section></main><script>const $=s=>document.querySelector(s);async function api(url,opts={}){let r=await fetch(url,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadPayments(){try{let d=await api('/api/admin/payments');$('#payments').innerHTML=d.payments.length?`<table><thead><tr><th>ID</th><th>选手/学校</th><th>Steam64</th><th>金额</th><th>订单号</th><th>付款人/时间</th><th>状态</th><th>审核备注</th><th>操作</th></tr></thead><tbody>${d.payments.map(p=>`<tr><td>${p.id}</td><td>${esc(p.player_name||p.username)} / ${esc(p.school||'未关联报名')}</td><td>${esc(p.steam_id||'')}</td><td>¥${(p.amount_cents/100).toFixed(2)}</td><td>${esc(p.payer_order_ref)}</td><td>${esc(p.payer_name)} / ${esc(p.paid_at_text)}</td><td>${esc(({pending:'待审核',paid:'已确认',rejected:'未通过'})[p.status]||p.status)}</td><td><input id="note${p.id}" value="${esc(p.admin_note)}" placeholder="审核备注"></td><td><button onclick="review(${p.id},'paid')">确认缴费</button><button onclick="review(${p.id},'rejected')">驳回</button></td></tr>`).join('')}</tbody></table>`:'暂无订单'}catch(e){$('#payments').textContent=e.message}}async function review(id,status){try{await api('/api/admin/payments',{method:'PATCH',body:JSON.stringify({payment_id:id,status,admin_note:$('#note'+id).value})});await loadPayments()}catch(e){alert(e.message)}}async function loadMatches(){try{let d=await api('/api/admin/matches');const opts=d.teams.map(t=>`<option value="${t.id}">${esc(t.name)} (${esc(t.status)})</option>`).join('');$('#team1').innerHTML=opts;$('#team2').innerHTML=opts;$('#matches').innerHTML=d.matches.map(m=>`<p>#${m.id} ${esc(m.title)} · ${esc(m.teams||'未分配')} · ${esc(m.starts_at)} · 房间号：${esc(m.room_code)}</p>`).join('')||'暂无比赛'}catch(e){$('#matches').textContent=e.message}}async function publish(){try{if($('#team1').value===$('#team2').value)throw Error('请选择两支不同队伍');let d=await api('/api/admin/matches',{method:'POST',body:JSON.stringify({title:$('#title').value,starts_at:$('#starts').value,room_code:$('#room').value,notes:$('#notes').value,team_ids:[$('#team1').value,$('#team2').value]})});$('#msg').textContent='比赛已发布，相关队伍成员登录后可查看房间号。';await loadMatches()}catch(e){$('#msg').textContent=e.message}}loadPayments();loadMatches();</script><script src="/portal.js"></script></body></html>
