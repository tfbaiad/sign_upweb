<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人信息</title><link rel="stylesheet" href="/portal.css">
<style>
.profile-card{background:#fff;border:1px solid #dce5eb;border-radius:12px;padding:24px;max-width:760px;margin:24px auto}
.profile-card h2{margin-top:0;color:#123b56}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.profile-item{padding:14px;background:#f5f8fa;border-radius:8px}.profile-item small{display:block;color:#71818c;margin-bottom:6px}.profile-item b{overflow-wrap:anywhere}
.muted{color:#71818c}.role-panel{margin-top:20px;padding:18px;background:#f5f8fa;border:1px solid #e0e8ee;border-radius:10px}
.role-panel h3{margin:0 0 8px;color:#123b56}.role-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.role-controls select,.role-controls button{font:inherit;padding:10px 12px;border:1px solid #bdcbd5;border-radius:7px}
.role-controls button{background:#123b56;color:#fff;border:0;cursor:pointer}.role-controls button:disabled{opacity:.6;cursor:wait}
#roleStatus{margin-top:10px;font-size:14px;white-space:pre-wrap}.links{margin-top:18px}
@media(max-width:600px){.profile-grid{grid-template-columns:1fr}.profile-card{margin:12px;padding:18px}.role-controls{align-items:stretch;flex-direction:column}.role-controls select,.role-controls button{width:100%}}
</style></head>
<body><main><section class="profile-card">
<h2>个人信息</h2><p class="muted">这里仅展示你的账户及报名个人资料。缴费请前往独立的缴费中心。</p>
<div id="profile">正在加载…</div>
<section class="role-panel" id="rolePanel" hidden>
<h3>参赛身份设置</h3>
<p class="muted">在这里设置你在本届联赛中的身份。选择“队长”后，可前往战队管理创建队伍；选择“队员”后，可加入已有队伍。</p>
<div class="role-controls"><select id="accountRole" aria-label="选择参赛身份"><option value="member">队员（加入已有战队）</option><option value="captain">队长（创建战队）</option></select><button id="saveRole" type="button">保存参赛身份</button></div>
<div id="roleStatus" role="status" aria-live="polite"></div>
</section>
<p class="links"><a href="/signup.html">查看 / 完善报名资料</a>　<a href="/payment.html">前往缴费中心 →</a>　<a href="/teams.html">战队管理 →</a></p>
</section></main>
<script>
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let account=null;
(async()=>{
 const el=document.querySelector('#profile'),panel=document.querySelector('#rolePanel'),roleSelect=document.querySelector('#accountRole'),saveBtn=document.querySelector('#saveRole'),status=document.querySelector('#roleStatus');
 try{
  const r=await fetch('/api/auth/me',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'请先登录');account=d.account;
  el.innerHTML=`<div class="profile-grid"><div class="profile-item"><small>账户用户名</small><b>${esc(account.username)}</b></div><div class="profile-item"><small>Steam64</small><b>${esc(account.steam_id)}</b></div><div class="profile-item"><small>游戏名称</small><b>${esc(account.player_name)}</b></div><div class="profile-item"><small>学校</small><b>${esc(account.school)}</b></div><div class="profile-item"><small>QQ</small><b>${esc(account.qq)}</b></div><div class="profile-item"><small>完美段位</small><b>${esc(account.rank)}</b></div><div class="profile-item"><small>报名资料</small><b>${account.player_id?'已提交':'尚未提交'}</b></div><div class="profile-item"><small>当前参赛身份</small><b>${account.account_role==='captain'?'队长':'队员'}</b></div></div>`;
  roleSelect.value=account.account_role||'member';panel.hidden=false;
 }catch(e){el.textContent=e.message;return}
 saveBtn.addEventListener('click',async()=>{
  const nextRole=roleSelect.value;saveBtn.disabled=true;saveBtn.textContent='正在保存…';status.textContent='';status.style.color='';
  try{const r=await fetch('/api/auth/role',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({account_role:nextRole})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'身份设置失败');
   account.account_role=d.account_role;const roleText=d.account_role==='captain'?'队长':'队员';const roleItem=[...document.querySelectorAll('.profile-item')].find(x=>x.querySelector('small')?.textContent==='当前参赛身份');if(roleItem)roleItem.querySelector('b').textContent=roleText;
   status.style.color='#167344';status.textContent='参赛身份已更新为：'+roleText+'。'+(d.account_role==='captain'?'现在可以前往战队管理创建队伍。':'现在可以前往战队列表加入队伍。');
  }catch(e){status.style.color='#b42318';status.textContent=e.message;roleSelect.value=account.account_role||'member'}
  finally{saveBtn.disabled=false;saveBtn.textContent='保存参赛身份'}
 });
})();
</script><script src="/portal.js"></script></body></html>
